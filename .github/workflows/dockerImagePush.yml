name: Builds docker image and pushes it

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            **/build/
          key: ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create example config
        run: |
          sudo mkdir /etc/game-server/
          sudo chmod -R ugo+rws /etc/game-server/
          mv .github/workflows/test-config.json /etc/game-server/config.json

      - name: Build jar
        run: gradle build

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            **/build/
          key: ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}

  test:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            **/build/
          key: ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create example config
        run: |
          sudo mkdir /etc/game-server/
          sudo chmod -R ugo+rws /etc/game-server/
          mv .github/workflows/test-config.json /etc/game-server/config.json

      - name: Run tests
        run: gradle test --rerun-tasks

  push-to-docker:
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            **/build/
          key: ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/libs.versions.toml') }}

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create example config
        run: |
          sudo mkdir /etc/game-server/
          sudo chmod -R ugo+rws /etc/game-server/
          mv .github/workflows/test-config.json /etc/game-server/config.json

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker tag
        id: tag
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
          COMMIT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
          echo "image_tag=${BRANCH_NAME}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: kroune/nine-mens-morris-server:${{ steps.tag.outputs.image_tag }}

  update-manifest:
    needs: [ push-to-docker ]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Docker tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
            COMMIT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
          else
            BRANCH_NAME=$(echo ${{ github.event.workflow_run.head_branch }} | sed 's/\//-/g')
            COMMIT_SHA=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)
          fi
          echo "image_tag=${BRANCH_NAME}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: kroune/nmm-deployment
          token: ${{ secrets.PAT_TOKEN }}
          path: deployment-repo

      - name: Update deployment.yaml
        run: |
          cd deployment-repo/game-server
          sed -i "s|image: kroune/nine-mens-morris-server:.*|image: kroune/nine-mens-morris-server:${{ steps.tag.outputs.image_tag }}|g" deployment.yaml

      - name: Commit and push changes
        run: |
          cd deployment-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add game-server/deployment.yaml
          git commit -m "Update image to ${{ steps.tag.outputs.image_tag }}"
          git push